[platformio]
default_envs = bootloader

[env]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
monitor_speed = 115200
upload_protocol = stlink

[env:bootloader]
build_src_filter = +<boot/>
board_build.ldscript = ld/bootloader.ld
build_flags = -I firmware/common -DBOOTLOADER_BUILD

[env:application]
build_src_filter = +<app/>
board_build.ldscript = ld/application.ld
build_flags = -DAPPLICATION_BUILD
