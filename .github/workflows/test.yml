name: host-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/common firmware/common/boot.c tests/test_boot.c -o /tmp/test_boot && /tmp/test_boot
      - run: pip install platformio
      - run: pio run -e bootloader -e application
